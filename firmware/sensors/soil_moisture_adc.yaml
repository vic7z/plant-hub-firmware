# sensors/soil_moisture_adc.yaml
# Capacitive soil moisture sensor via ADC
#
# Required substitutions:
#   ${soil_moisture_pin}  — GPIO pin (e.g. GPIO1)
#   ${soil_dry_value}     — ADC voltage when sensor is in dry air (e.g. 2.8)
#   ${soil_wet_value}     — ADC voltage when sensor is submerged in water (e.g. 1.2)
#   ${sensor_update_interval} — how often to read (e.g. 30s)
#
# Wiring:
#   AOUT → ${soil_moisture_pin}
#   VCC  → 3.3V
#   GND  → GND

sensor:
  # Raw ADC reading (internal, not exposed).
  # Sampled fast (1 s) so the USB calibration UI shows a live voltage —
  # decoupled from ${sensor_update_interval} which controls how often
  # the calibrated percentage is published to MQTT. ADC reads on the
  # C3 cost microseconds, so 1 s polling is essentially free.
  - platform: adc
    pin: ${soil_moisture_pin}
    name: "Soil Moisture Raw"
    id: soil_raw
    attenuation: 12db
    update_interval: 1s
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!std::isnan(x)) planthub::soil_cal_raw_v = x;

  # Calibrated percentage (0-100%)
  - platform: template
    name: "Soil Moisture"
    id: soil_moisture
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:water-percent"
    update_interval: ${sensor_update_interval}
    lambda: |-
      float raw = id(soil_raw).state;
      if (isnan(raw)) return NAN;

      float dry = planthub::soil_cal_dry;
      float wet = planthub::soil_cal_wet;
      float pct = (dry - raw) / (dry - wet) * 100.0;

      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;

      id(sensor_values)["soilMoisture"] = pct;
      id(evaluate_rules).execute(std::string("soilMoisture"), pct);
      return pct;

# 50 ms polling drives the USB-CDC calibration command listener. The
# init call is idempotent (guarded by `if (inited) return;`) so it's a
# single branch on every tick after the first — but the first tick is
# what installs the USB-CDC driver and loads NVS values, so the device
# is ready to answer `@CAL GET` within ~50 ms of boot. Doing this here
# instead of inside the soil_moisture lambda matters because that
# lambda only fires every ${sensor_update_interval} (30–60 s on real
# variants), which left a long window where calibration over USB
# silently failed with "port didn't respond".
interval:
  - interval: 50ms
    then:
      - lambda: |-
          planthub::soil_cal_init(${soil_dry_value}, ${soil_wet_value});
          planthub::soil_cal_poll();
